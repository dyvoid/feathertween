name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet-harness:
    name: Compile check + EditMode tests (.NET stub harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Runtime + Samples against Unity stubs
        run: dotnet build tools~/compile-check/PATween.CompileCheck.csproj -c Release

      - name: Run EditMode suite (NUnitLite, excludes RequiresUnity)
        run: >
          dotnet run --project tools~/compile-check/PATween.TestRunner.csproj
          -c Release -- --noresult --where "cat != RequiresUnity"

      # Safe mode is compiled out under PATWEEN_RELEASE; this leg proves the
      # release path builds and behaves (ReleaseModeTests: throwing setter
      # propagates despite SetSafeMode(true)).
      - name: Run EditMode suite with PATWEEN_RELEASE (safe mode compiled out)
        run: >
          dotnet run --project tools~/compile-check/PATween.TestRunner.csproj
          -c Release -p:DefineConstants=PATWEEN_RELEASE
          -- --noresult --where "cat != RequiresUnity && cat != RequiresSafeMode"
