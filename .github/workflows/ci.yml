name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet-harness:
    name: Compile check + EditMode tests (.NET stub harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Runtime + Samples against Unity stubs
        run: dotnet build tools~/compile-check/FeatherTween.CompileCheck.csproj -c Release

      # Phase 1.16 gate: every public Runtime type/member has an XML doc
      # comment (CS1591 as error, Runtime only).
      - name: XML doc coverage check
        run: dotnet build tools~/compile-check/FeatherTween.DocCheck.csproj -c Release

      - name: Run EditMode suite (NUnitLite, excludes RequiresUnity)
        run: >
          dotnet run --project tools~/compile-check/FeatherTween.TestRunner.csproj
          -c Release -- --noresult --where "cat != RequiresUnity"

      # Safe mode is compiled out under FEATHERTWEEN_RELEASE; this leg proves the
      # release path builds and behaves (ReleaseModeTests: throwing setter
      # propagates despite SetSafeMode(true)).
      - name: Run EditMode suite with FEATHERTWEEN_RELEASE (safe mode compiled out)
        run: >
          dotnet run --project tools~/compile-check/FeatherTween.TestRunner.csproj
          -c Release -p:DefineConstants=FEATHERTWEEN_RELEASE
          -- --noresult --where "cat != RequiresUnity && cat != RequiresSafeMode"
